<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <!-- White Background with soft gold accent -->
  <rect width="320" height="220" rx="16" fill="#FFFDF5" stroke="#FDE68A" stroke-width="2"/>
  
  <text x="160" y="36" font-family="'Noto Sans', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#92400E">
    BIS HALLMARK FOR GOLD
  </text>
  
  <line x1="40" y1="46" x2="280" y2="46" stroke="#F59E0B" stroke-width="2" />
  
  <!-- 3 Pillars of BIS Hallmark (Triangular Mark, Purity, 6-digit HUID) -->
  <g transform="translate(30, 60)">
    <!-- 1. BIS Triangle Logo -->
    <g transform="translate(10, 10) scale(0.65)">
      <polygon points="50,10 90,85 10,85" fill="#D97706" stroke="#92400E" stroke-width="4"/>
      <polygon points="50,28 78,80 22,80" fill="#FFFDF5"/>
      <circle cx="50" cy="58" r="8" fill="#D97706"/>
    </g>
    <text x="42" y="80" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#92400E">
      BIS Standard
    </text>

    <!-- 2. Purity in Karats & Fineness -->
    <g transform="translate(105, 12)">
      <rect x="0" y="0" width="60" height="50" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="30" y="24" font-family="'Noto Sans', Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#92400E">
        22K
      </text>
      <text x="30" y="42" font-family="'Noto Sans', Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#B45309">
        916
      </text>
    </g>
    <text x="135" y="80" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#92400E">
      Purity Grade
    </text>

    <!-- 3. 6-Digit Alphanumeric HUID -->
    <g transform="translate(185, 12)">
      <rect x="0" y="0" width="70" height="50" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="35" y="32" font-family="'Courier New', monospace" font-size="14" font-weight="900" text-anchor="middle" fill="#92400E" letter-spacing="1">
        AB72K9
      </text>
    </g>
    <text x="220" y="80" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#92400E">
      6-Digit HUID
    </text>
  </g>
  
  <line x1="40" y1="168" x2="280" y2="168" stroke="#FDE68A" stroke-width="1.5" />
  
  <text x="160" y="194" font-family="'Noto Sans', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#78350F">
    Traceable to authorized Assaying & Hallmarking Centre
  </text>
</svg>
